services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-pipeline-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=sqlite+aiosqlite:///./data/contracts.db
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal-pipeline-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
